version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns:
          - '*'

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    groups:
      scripts:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
      day: monday
    groups:
      typescript:
        patterns:
          - '*'

  - package-ecosystem: gradle
    directory: /java
    schedule:
      interval: weekly
      day: monday
    # Gradle 9 requires JVM 17, and JUnit 6 requires Java 17.
    ignore:
      - dependency-name: 'gradle-wrapper'
        update-types:
          - version-update:semver-major
      - dependency-name: 'org.junit.jupiter:*'
        update-types:
          - version-update:semver-major
    groups:
      java:
        patterns:
          - '*'
