name: Java CI
on:
  push:
    branches:
      - main
    paths:
      - java/**
      - .github/workflows/java.yaml
      - codecov.yml
  pull_request:
    branches:
      - main
    paths:
      - java/**
      - .github/workflows/java.yaml
      - codecov.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: 8
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run automated tests
        run: |
          mkdir _support
          python3 scripts/src/load/merge_data.py -o _support/merged_data.build.json
          ls -l _support || true
          cd java
          ./gradlew -Plicenselynx.datafile=../_support/merged_data.build.json ${GRADLE_ARGUMENTS} clean build jacocoTestReport publishAllPublicationsToStagingDeployRepository | tee job.log
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: java/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java
          fail_ci_if_error: true
          disable_search: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
