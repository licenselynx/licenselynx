name: Java CI
on:
  push:
    branches:
      - main
    paths:
      - java/**
      - fixtures/**
      - .github/workflows/java.yaml
      - codecov.yml
  pull_request:
    branches:
      - main
    paths:
      - java/**
      - fixtures/**
      - .github/workflows/java.yaml
      - codecov.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 8
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run automated tests
        run: |
          mkdir _support
          python3 scripts/src/load/merge_data.py -o _support/merged_data.build.json
          ls -l _support || true
          cd java
          ./gradlew -Plicenselynx.datafile=../_support/merged_data.build.json ${GRADLE_ARGUMENTS} clean build jacocoTestReport publishAllPublicationsToStagingDeployRepository | tee job.log
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: java/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java
          fail_ci_if_error: true
          disable_search: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
