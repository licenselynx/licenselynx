name: Go CI
on:
  push:
    branches:
      - main
    paths:
      - go.mod
      - go/**
      - data/**
      - .github/workflows/go.yaml
      - codecov.yml
  pull_request:
    branches:
      - main
    paths:
      - go.mod
      - go/**
      - data/**
      - .github/workflows/go.yaml
      - codecov.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check-generated-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Generate merged data
        run: |
          mkdir -p _support
          python3 scripts/src/load/merge_data.py -o ./_support/merged_data.build.json
      - name: Regenerate Go sources
        run: |
          go generate ./go/...
      - name: Verify generated files are committed
        run: |
          git diff --exit-code -- go
          if [ -n "$(git status --short --untracked-files=all -- go)" ]; then
            git status --short --untracked-files=all -- go
            exit 1
          fi
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # we still want tests to run if vet fails, and we want all versions to run even if one fails
      matrix:
        go-version:
          - '1.25'
          - '1.26'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run go vet
        run: |
          go vet ./go/...
      # we only want one of the tests jobs to generate coverage reports to avoid conflicts when uploading to codecov
      - name: Run tests with coverage
        if: matrix.go-version == '1.26'
        run: |
          go test -coverprofile=go/coverage.out ./go/...
      - name: Run tests
        if: matrix.go-version != '1.26'
        run: |
          go test -race ./go/...
      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.26'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          files: go/coverage.out
          flags: go
          fail_ci_if_error: true
          disable_search: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./go/...
