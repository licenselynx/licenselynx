[project]
name = "licenselynx"
version = "2.3.4"
description = "Deterministically map license strings to its canonical identifier"
authors = [
    { name = "Leo Reinmann", email = "leo.reinmann@siemens.com" }
]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"



[tool.poetry]
name = "licenselynx"
version = "2.1.3"
description = "Deterministically map license strings to its canonical identifier"
authors = ["Leo Reinmann <leo.reinmann@siemens.com>"]
package-mode = true
packages = [
    { include = "licenselynx" }
]
include = [
    { path = "licenselynx/resources/merged_data.json", format = ["sdist", "wheel"] }
]

[tool.poetry.group.dev.dependencies]
mypy = ">=1.8,<3.0"
flake8 = "^7.0.0"
# Python 3.9 compatibility only; see README for the legacy pytest advisory.
pytest = [
    { version = "==8.4.2", python = ">=3.9,<3.10" },
    { version = "==9.1.1", python = ">=3.10" },
]
coverage = "^7.5.1"


[tool.pytest.ini_options]
markers = [
    "smoke: Smoke integration tests that require merged data to be present",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
